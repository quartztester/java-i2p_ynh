packaging_format = 2

id = "java_i2p"
name = "I2P router (Java)"
description.en = "Upstream Java I2P router (i2p.i2p) volunteering relay capacity; distinct from the i2pd C++ router"

version = "2.13.1~ynh3"

maintainers = []

[upstream]
license = "Unlicense"
website = "https://geti2p.net"
code = "https://github.com/i2p/i2p.i2p"
admindoc = "https://geti2p.net/en/get-i2p-on-debian-and-ubuntu"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "1G"
ram.build = "50M"
ram.runtime = "900M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.jvm_xmx]
    ask.en = "Java heap limit (e.g. 768m)"
    help.en = "I2P is a Java app. 768m suits a relay; a floodfill router wants 1g or more."
    type = "string"
    default = "768m"

[resources]
    [resources.system_user]

    # Router identity, netDB and config — the crown jewels. Backed up and
    # restored with the app by convention. NB: no install_dir resource; the
    # app lives entirely in the apt prefix + data_dir.
    [resources.data_dir]

    [resources.permissions]
        main.url = "/"
        # The I2P console does its own optional auth; ssowat must not inject
        # Basic creds. SSO still gates the URL.
        main.auth_header = false

    [resources.ports]
    # Console port: bound to loopback by the router, never firewalled open.
    main.default = 7657
    # I2NP peer port: one port for both transports (NTCP2=TCP, SSU2=UDP).
    # Fixed so admins can set up a stable router port-forward; the firewall
    # open/close is handled by this resource (setting: $port_ext).
    # NB: named "ext" so the legacy 'ext_port' setting auto-migrates.
    ext.default = 51427
    ext.exposed = "Both"
    ext.fixed = true
